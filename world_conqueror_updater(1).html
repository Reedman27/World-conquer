<!--
  World Conqueror updater — made by Reedman27
  Pulls the game from https://github.com/Reedman27/World-conquer
-->
<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #0b0f0c;
  }

  #g {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: #0b0f0c;
  }
</style>

<iframe id="g" title="World Conqueror" allowfullscreen></iframe>

<script>
(() => {
  "use strict";

  /* ================= SETTINGS ================= */

  // The on/off switch.
  //   false = ON HOLD: nothing is fetched from GitHub.
  //   true  = pull the game from GitHub on load, then again every hour.
  const PULL_FROM_GITHUB = true;

  // Which game to pull from https://github.com/Reedman27/World-conquer
  // This is the turn-based version.
  // (Use "world_conqueror_non_turn_based.html" for the real-time one.)
  const SOURCE =
    "https://raw.githubusercontent.com/Reedman27/" +
    "World-conquer/main/world_conqueror.html";

  // Optional: paste a full game HTML here to play it while on hold.
  // Left empty, the hold screen below is shown instead.
  const HELD_GAME_HTML = "";

  // Pull at the top of every UTC hour (plus once on load).
  // If an update lands while someone is mid-game, it waits until they are back
  // on the start/end screen, so a running game is never reset under them.
  // Set to true to swap the game in immediately, even mid-game.
  const APPLY_WHILE_PLAYING = false;

  /* ============================================ */

  const game = document.getElementById("g");

  let currentHTML = null;   // what is on screen right now
  let pendingHTML = null;   // downloaded, waiting for a safe moment
  let busy = false;
  let retryAfter = 0;
  let lastPulledHour = null;

  const utcHour = () => new Date().toISOString().slice(0, 13); // e.g. 2026-10-19T18

  const holdScreen = `<!doctype html><meta charset="utf-8">
    <body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0b0f0c;color:#aab6ac;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center">
      <div><div style="font-size:22px;color:#c9a24b;letter-spacing:.06em;margin-bottom:10px">WORLD CONQUEROR</div>
      <div id="msg">Updates are on hold.</div>
      <div style="font-size:12px;color:#748077;margin-top:8px">Set PULL_FROM_GITHUB to true to load the game from GitHub.</div>
      <div style="font-size:11px;color:#8f7738;margin-top:18px;letter-spacing:.08em">MADE BY REEDMAN27</div></div>`;

  const loadingScreen = holdScreen.replace("Updates are on hold.", "Loading the latest version from GitHub…").replace("Set PULL_FROM_GITHUB to true to load the game from GitHub.", "If this stays here, GitHub could not be reached. Retrying automatically.");

  // Same-origin srcdoc lets us peek at whether a game is running.
  function gameInProgress() {
    try {
      return !!game.contentWindow.document.querySelector(".act-btn");
    } catch (e) {
      return false; // can't tell: treat as idle
    }
  }

  function show(html) {
    game.srcdoc = html;
    currentHTML = html;
    pendingHTML = null;
  }

  function applyPending() {
    if (!pendingHTML) return;
    if (APPLY_WHILE_PLAYING || !gameInProgress()) show(pendingHTML);
  }

  async function pullGame() {
    if (busy) return;
    busy = true;

    try {
      const response = await fetch(SOURCE + "?_=" + Date.now(), {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("GitHub HTTP " + response.status);
      }

      const html = await response.text();

      if (!html.trim() || !html.includes("<html")) {
        throw new Error("Invalid game HTML");
      }

      if (currentHTML === null) {
        show(html);                                  // first load
      } else if (html !== currentHTML) {
        pendingHTML = html;                          // changed upstream
        applyPending();
      } else {
        pendingHTML = null;                          // already up to date
      }

      lastPulledHour = utcHour();
      retryAfter = 0;
    } catch (error) {
      console.error("World Conqueror update failed:", error);
      retryAfter = Date.now() + 60000;
    } finally {
      busy = false;
    }
  }

  function checkSchedule() {
    if (!PULL_FROM_GITHUB) return;
    applyPending();
    if (Date.now() < retryAfter) return;

    if (currentHTML === null || lastPulledHour !== utcHour()) {
      pullGame();
    }
  }

  if (PULL_FROM_GITHUB) {
    game.srcdoc = loadingScreen;
    pullGame();
    setInterval(checkSchedule, 15000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkSchedule();
    });
  } else {
    show(HELD_GAME_HTML.trim() ? HELD_GAME_HTML : holdScreen);
  }
})();
</script>
